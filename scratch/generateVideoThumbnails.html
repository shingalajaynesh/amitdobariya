      { id: "m_24", url: "/Motivational%20Video/Video-95704.mp4" }
    ];

    async function generateThumbnail(item) {
      return new Promise((resolve) => {
        const video = document.createElement('video');
        video.src = item.url;
        video.crossOrigin = 'anonymous';
        video.currentTime = 1.0;
        video.muted = true;

        video.onseeked = () => {
          const canvas = document.createElement('canvas');
          canvas.width = 640;
          canvas.height = 360;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

          const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
          
          const img = document.createElement('img');
          img.src = dataUrl;
          img.style.width = '200px';
          img.title = item.id;
          document.getElementById('gallery').appendChild(img);

          // Send to local server to save
          fetch('/api/save-thumbnail', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: item.id, dataUrl })
          }).then(() => resolve()).catch(() => resolve());
        };

        video.onerror = () => {
          console.error("Error loading video", item.url);
          resolve();
        };
      });
    }

    async function processAll() {
      for (const item of videos) {
        document.getElementById('status').innerText = 'Processing ' + item.id + '...';
        await generateThumbnail(item);
      }
      document.getElementById('status').innerText = 'All Thumbnails Processed!';
    }

    window.onload = processAll;
  </script>
